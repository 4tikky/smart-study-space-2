<!doctype html><html lang="id"><meta charset="utf-8"><title>Uji inferensi lokal</title><body>
<script type="module">
  import { detectImage, predict, warmup } from '/src/services/vision/engine.ts'
  import { processingSize, letterbox, decodeDetections, SessionTracker, aggregate } from '/src/services/vision/core.ts'
  import { processVideo, openVideo } from '/src/services/vision/video.ts'
  import { startCamera } from '/src/services/vision/camera.ts'
  import { Input, BlobSource, ALL_FORMATS } from 'mediabunny'
  import { setLocalPreview, getLocalPreview } from '/src/services/cloud-data.ts'
  window.vision = { detectImage, predict, warmup, processingSize, letterbox, decodeDetections, SessionTracker, aggregate, processVideo, openVideo, startCamera, setLocalPreview, getLocalPreview,
    async inspectOutput(blob) {
      const input = new Input({ source: new BlobSource(blob), formats: ALL_FORMATS })
      try {
        const track = await input.getPrimaryVideoTrack()
        return { width: await track.getDisplayWidth(), height: await track.getDisplayHeight(), duration: await track.computeDuration(), stats: await track.computePacketStats() }
      } finally { input.dispose() }
    }
  }
</script></body></html>
